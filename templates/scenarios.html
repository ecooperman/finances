<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scenarios · Finances</title>
  <link rel="stylesheet" href="{{ shared_assets_base }}/theme.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Scenarios</h1>
    <p class="subtitle">What-ifs layered over the real budget. Nothing here changes your actual rows.</p>
  </header>

  <div id="app-nav-mount"></div>

  <main>
    <div id="page-message" class="page-message hidden"></div>

    <button id="show-add" type="button" class="add-toggle">+ Add scenario</button>
    <form id="add-form" class="add-card hidden">
      <div class="field">
        <label for="s-name">Name <span class="required">*</span></label>
        <input id="s-name" name="name" type="text" required placeholder="e.g. Buy a car" />
      </div>
      <div class="field">
        <label for="s-notes">Notes</label>
        <textarea id="s-notes" name="notes" rows="2" placeholder="Optional"></textarea>
      </div>
      <div class="item-actions">
        <button type="submit" class="save-btn">Create scenario</button>
        <button type="button" id="cancel-add" class="cancel-btn">Cancel</button>
      </div>
    </form>

    <section class="fin-section">
      <div class="list-header">
        <h2>Scenarios</h2>
        <span id="count" class="list-count"></span>
      </div>
      <div id="list" class="item-list"></div>
      <p id="empty" class="empty-state hidden">No scenarios yet - add one above.</p>
    </section>

    <div id="app-version"></div>
  </main>

  <script src="{{ shared_assets_base }}/theme.js"></script>
  <script src="{{ shared_assets_base }}/icons.js"></script>
  <script src="version.js"></script>
  <script src="common.js"></script>
  <script src="nav.js"></script>
  <script src="scenarios.js"></script>
</body>
</html>
