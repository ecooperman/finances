<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monthly · Finances</title>
  <link rel="stylesheet" href="{{ shared_assets_base }}/theme.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Monthly</h1>
    <p class="subtitle">Money in minus money out, for one month.</p>
  </header>

  <div id="app-nav-mount"></div>

  <main>
    <div id="page-message" class="page-message hidden"></div>

    <div class="fin-monthbar">
      <button type="button" id="month-prev" class="fin-step" aria-label="Previous month">‹</button>
      <div class="fin-monthbar-label">
        <span id="month-label">—</span>
        <button type="button" id="month-today" class="fin-today-link">This month</button>
      </div>
      <button type="button" id="month-next" class="fin-step" aria-label="Next month">›</button>
    </div>

    <div class="fin-filters">
      <label class="fin-filter">
        <span>Person</span>
        <select id="filter-person"></select>
      </label>
      <label class="fin-filter">
        <span>Categories</span>
        <span id="filter-category"></span>
      </label>
      <label class="fin-filter">
        <span>Scenario</span>
        <select id="filter-scenario"></select>
      </label>
    </div>

    <button id="show-add-txn" type="button" class="add-toggle">+ Add transaction</button>
    <form id="add-txn-form" class="add-card hidden">
      <div class="field-row">
        <div class="field">
          <label for="txn-date">Date <span class="required">*</span></label>
          <input id="txn-date" name="date" type="date" required />
        </div>
        <div class="field">
          <label for="txn-amount">Amount ($) <span class="required">*</span></label>
          <input id="txn-amount" name="amount" type="text" inputmode="decimal" required placeholder="1200.00" />
        </div>
      </div>
      <div class="field">
        <label for="txn-description">Description <span class="required">*</span></label>
        <input id="txn-description" name="description" type="text" required placeholder="e.g. New water heater" />
      </div>
      <div class="field-row">
        <div class="field">
          <label for="txn-direction">Direction</label>
          <select id="txn-direction" name="direction">
            <option value="out">Money out</option>
            <option value="in">Money in</option>
          </select>
        </div>
        <div class="field">
          <label for="txn-category">Category</label>
          <select id="txn-category" name="category_id"></select>
        </div>
        <div class="field">
          <label for="txn-person">Person</label>
          <select id="txn-person" name="person_id"></select>
        </div>
      </div>
      <div class="item-actions">
        <button type="submit" class="save-btn">Add transaction</button>
        <button type="button" id="cancel-add-txn" class="cancel-btn">Cancel</button>
      </div>
    </form>

    <section class="fin-section">
      <div class="list-header">
        <h2>Money in</h2>
        <span id="in-count" class="list-count"></span>
      </div>
      <div id="money-in" class="item-list"></div>
    </section>

    <section class="fin-section">
      <div class="list-header">
        <h2>Money out</h2>
        <span id="out-count" class="list-count"></span>
      </div>
      <div id="money-out" class="item-list"></div>
    </section>

    <div id="totals" class="fin-totals"></div>

    <div id="app-version"></div>
  </main>

  <script src="{{ shared_assets_base }}/theme.js"></script>
  <script src="{{ shared_assets_base }}/icons.js"></script>
  <script src="version.js"></script>
  <script src="common.js"></script>
  <script src="nav.js"></script>
  <script src="app.js"></script>
</body>
</html>
