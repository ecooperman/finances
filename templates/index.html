<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overview · Finances</title>
  <link rel="stylesheet" href="{{ shared_assets_base }}/theme.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Overview</h1>
    <p class="subtitle">Money in minus money out, for one month.</p>
  </header>

  <div id="app-nav-mount"></div>

  <main>
    <div id="page-message" class="page-message hidden"></div>

    <section class="fin-paycheck" id="paycheck-card">
      <div class="fin-paycheck-head">
        <h2>Until next paycheck</h2>
        <label class="fin-paycheck-who">
          <span>Paycheck</span>
          <select id="paycheck-person"></select>
        </label>
      </div>
      <div id="paycheck-body"></div>
    </section>

    <div class="fin-monthbar">
      <button type="button" id="month-prev" class="fin-step" aria-label="Previous month">‹</button>
      <div class="fin-monthbar-label">
        <span id="month-label">—</span>
        <button type="button" id="month-today" class="fin-today-link">This month</button>
      </div>
      <button type="button" id="month-next" class="fin-step" aria-label="Next month">›</button>
    </div>

    <div class="fin-filters">
      <label class="fin-filter">
        <span>Person</span>
        <select id="filter-person"></select>
      </label>
      <label class="fin-filter">
        <span>Categories</span>
        <span id="filter-category"></span>
      </label>
      <label class="fin-filter">
        <span>Scenario</span>
        <select id="filter-scenario"></select>
      </label>
    </div>

    <section class="fin-section fin-cal-section">
      <div class="list-header">
        <h2>Payment calendar</h2>
        <span class="list-count">reflects the filters above</span>
      </div>
      <div id="calendar" class="fin-cal"></div>
      <p id="cal-carry" class="fin-cal-noday fin-cal-carry hidden"></p>
      <p id="cal-noday" class="fin-cal-noday hidden"></p>
    </section>

    <button id="show-add" type="button" class="add-toggle">+ Add</button>
    <form id="add-entry-form" class="add-card hidden"></form>

    <section class="fin-section">
      <div class="list-header">
        <h2>Money in</h2>
        <span id="in-count" class="list-count"></span>
      </div>
      <div id="money-in" class="item-list"></div>
    </section>

    <section class="fin-section">
      <div class="list-header">
        <h2>Money out</h2>
        <span id="out-count" class="list-count"></span>
      </div>
      <div id="money-out" class="item-list"></div>
    </section>

    <div id="totals" class="fin-totals"></div>

    <div id="app-version"></div>
  </main>

  <div id="day-modal" class="modal-overlay hidden">
    <div class="modal fin-day-modal" role="dialog" aria-modal="true" aria-labelledby="day-modal-title">
      <button type="button" class="modal-close" aria-label="Close" onclick="Global.closeModal('day-modal')">&times;</button>
      <h2 id="day-modal-title"></h2>
      <div id="day-modal-body"></div>
    </div>
  </div>

  <script src="{{ shared_assets_base }}/theme.js"></script>
  <script src="{{ shared_assets_base }}/icons.js"></script>
  <script src="version.js"></script>
  <script src="common.js"></script>
  <script src="nav.js"></script>
  <script src="app.js"></script>
</body>
</html>
