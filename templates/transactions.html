<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transactions · Finances</title>
  <link rel="stylesheet" href="{{ shared_assets_base }}/theme.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Transactions</h1>
    <p class="subtitle">One-off items that move the needle - big purchases, bonuses, refunds.</p>
  </header>

  <div id="app-nav-mount"></div>

  <main>
    <div id="page-message" class="page-message hidden"></div>

    <div class="fin-filters">
      <label class="fin-filter">
        <span>Month</span>
        <input id="filter-month" type="month" />
      </label>
      <label class="fin-filter">
        <span>Person</span>
        <select id="filter-person"></select>
      </label>
      <label class="fin-filter">
        <span>Categories</span>
        <span id="filter-category"></span>
      </label>
      <button type="button" id="filter-clear" class="secondary-btn">All time</button>
    </div>

    <button id="show-add" type="button" class="add-toggle">+ Add transaction</button>
    <form id="add-form" class="add-card hidden"></form>

    <section class="fin-section">
      <div class="list-header">
        <h2>Transactions</h2>
        <span id="count" class="list-count"></span>
      </div>
      <div id="list" class="item-list"></div>
      <p id="empty" class="empty-state hidden">No transactions match.</p>
    </section>

    <div id="totals" class="fin-totals"></div>

    <div id="app-version"></div>
  </main>

  <script src="{{ shared_assets_base }}/theme.js"></script>
  <script src="{{ shared_assets_base }}/icons.js"></script>
  <script src="version.js"></script>
  <script src="common.js"></script>
  <script src="nav.js"></script>
  <script src="transactions.js"></script>
</body>
</html>
